name: Brook
options:
  bundleIdPrefix: app.brook
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    CLANG_CXX_LANGUAGE_STANDARD: c++23
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Brook:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - sdk: AppKit.framework
      - sdk: WebKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
      - sdk: UserNotifications.framework
      - sdk: libsqlite3.tbd
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: Brook
        CFBundleDisplayName: Brook
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSCameraUsageDescription: Websites you allow can use your camera.
        NSMicrophoneUsageDescription: Websites you allow can use your microphone.
        NSLocationUsageDescription: Websites you allow can know your location.
        NSLocationWhenInUseUsageDescription: Websites you allow can know your location.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.html, public.xhtml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.brook.browser
        PRODUCT_NAME: Brook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
